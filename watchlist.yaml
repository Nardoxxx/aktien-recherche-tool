# Watchlist für das Aktien Recherche Tool
# Diese Datei ist frei editierbar: Zeilen hinzufügen/löschen/anpassen und speichern reicht.
#
# Feld "eodhd_symbol": Ticker + EODHD-Börsen-Suffix im Format TICKER.EXCHANGE
# (z.B. AAPL.US, SAP.XETRA). Stand 17.08.2026 gegen die ECHTE EODHD-API getestet
# (voller Lauf über alle 31 Titel, siehe Projektnotiz "Status"): 30 von 31 Symbolen
# funktionieren direkt. Einzige Korrektur: Leonardo S.p.A. hat keine direkte
# Mailand-Notierung (LDO.MI) bei EODHD - stattdessen 0ONG.LSE (Londoner Notierung
# derselben Aktie, gleiche ISIN) verwendet, siehe Notiz beim Eintrag unten.
#
# Feld "cluster": frei genutzt für den Abschnitt "Diese Woche im Fokus" im Report,
# um thematisch/wertschöpfungskettenmäßig verbundene Titel zu gruppieren.

